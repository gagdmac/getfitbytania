<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — GetFitByTania · Tania Angulo</title>
  <meta name="description" content="Contacta con Tania Angulo — entrenadora personal en Alicante. Cuéntame tu objetivo y diseñamos juntos tu plan de entrenamiento.">
  <script src="../components/cache-bust.js"></script>
  <script src="../components/head.js"></script>
</head>
<body>
  <script src="../components/header.js"></script>


  <!-- ═══════════════════════════════════════════
       MAIN CONTENT
       ═══════════════════════════════════════════ -->
  <main id="main-content">

    <!-- ─── CONTACT HERO ─── -->
    <section id="hero" class="contact-hero" aria-labelledby="contact-heading">
      <!-- Decorative background -->
      <div class="contact-hero__bg" aria-hidden="true">
        <div class="contact-hero__shape contact-hero__shape--1"></div>
        <div class="contact-hero__shape contact-hero__shape--2"></div>
        <div class="contact-hero__shape contact-hero__shape--3"></div>
        <div class="contact-hero__line contact-hero__line--1"></div>
        <div class="contact-hero__line contact-hero__line--2"></div>
      </div>

      <div class="container">
        <div class="row align-items-center contact-hero__row">

          <!-- Left — big text, CTA -->
          <div class="col-12 col-lg-7">
            <div class="contact-hero__content">
              <p class="hero-eyebrow" data-i18n="contact.eyebrow">Tania Angulo · Alicante</p>
              <h1 id="contact-heading" class="contact-hero__title" data-i18n="contact.heading">¿Empezamos?</h1>
              <p class="contact-hero__subtitle" data-i18n="contact.intro">Cuéntame tu objetivo y diseñamos juntos el entrenamiento perfecto para ti.</p>
              <div class="hero-actions">
                <a href="#contact-form-section" class="btn-cta" data-i18n="contact.heroCta">Escríbeme</a>
                <a href="https://wa.me/34620098860" target="_blank" rel="noopener noreferrer" class="btn-ghost"><i class="fab fa-whatsapp" aria-hidden="true"></i> WhatsApp</a>
              </div>
            </div>
          </div>

          <!-- Right — quick contact cards -->
          <div class="col-12 col-lg-5">
            <div class="contact-hero__cards">
              <a href="https://wa.me/34620098860" target="_blank" rel="noopener noreferrer" class="contact-hero__card contact-hero__card--wa">
                <span class="contact-hero__card-icon"><i class="fab fa-whatsapp" aria-hidden="true"></i></span>
                <span class="contact-hero__card-label">+34 620 098 860</span>
              </a>
              <a href="https://www.instagram.com/tania.angulo_trainer" target="_blank" rel="noopener noreferrer" class="contact-hero__card contact-hero__card--ig">
                <span class="contact-hero__card-icon"><i class="fab fa-instagram" aria-hidden="true"></i></span>
                <span class="contact-hero__card-label">@tania.angulo_trainer</span>
              </a>
              <div class="contact-hero__card contact-hero__card--loc">
                <span class="contact-hero__card-icon"><i class="fas fa-map-marker-alt" aria-hidden="true"></i></span>
                <span class="contact-hero__card-label">Alicante, España</span>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- ─── CONTACT FORM ─── -->
    <section id="contact-form-section" class="section" aria-labelledby="contact-form-heading">
      <div class="container">
        <div class="row g-4 g-lg-5 justify-content-center">
          <div class="col-12 col-lg-7">
            <h2 id="contact-form-heading" class="sr-only" data-i18n="contact.formLabelMessage">Mensaje</h2>
            <form id="contact-form" class="contact-form" novalidate>
              <div class="form-group">
                <label for="contact-name" data-i18n="contact.formLabelName">Nombre</label>
                <input type="text" id="contact-name" name="name" required autocomplete="name" aria-describedby="error-name" data-i18n-placeholder="contact.formPlaceholderName" placeholder="Tu nombre">
                <span id="error-name" class="field-error" role="alert" aria-live="assertive"></span>
              </div>

              <div class="form-group">
                <label for="contact-email" data-i18n="contact.formLabelEmail">Email</label>
                <input type="email" id="contact-email" name="email" required autocomplete="email" aria-describedby="error-email" data-i18n-placeholder="contact.formPlaceholderEmail" placeholder="tu@email.com">
                <span id="error-email" class="field-error" role="alert" aria-live="assertive"></span>
              </div>

              <div class="form-group">
                <label for="contact-message" data-i18n="contact.formLabelMessage">Mensaje</label>
                <textarea id="contact-message" name="message" rows="5" required aria-describedby="error-message" data-i18n-placeholder="contact.formPlaceholderMessage" placeholder="Cuéntame tu objetivo…"></textarea>
                <span id="error-message" class="field-error" role="alert" aria-live="assertive"></span>
              </div>

              <button type="submit" class="btn-cta btn-cta--form" data-i18n="contact.formSubmit">Enviar mensaje</button>
              <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            </form>
          </div>

          <!-- Contact info sidebar -->
          <div class="col-12 col-lg-4 offset-lg-1">
            <div class="contact-info-card">
              <h3 class="contact-info-title" data-i18n="footer.contactTitle">Contacto</h3>
              <ul class="contact-info-list" role="list">
                <li>
                  <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
                  <span>Alicante, España</span>
                </li>
                <li>
                  <a href="https://wa.me/34620098860" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-whatsapp" aria-hidden="true"></i>
                    <span>+34 620 098 860</span>
                  </a>
                </li>
                <li>
                  <a href="https://www.instagram.com/tania.angulo_trainer" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-instagram" aria-hidden="true"></i>
                    <span>@tania.angulo_trainer</span>
                  </a>
                </li>
              </ul>

              <div class="contact-social">
                <p class="contact-social-label" data-i18n="contact.followMe">Sígueme</p>
                <nav aria-label="Social media">
                  <ul class="social-links" role="list">
                    <li><a href="https://www.instagram.com/tania.angulo_trainer" target="_blank" rel="noopener noreferrer" data-i18n-aria-label="aria.instagramLabel" aria-label="Instagram (abre en ventana nueva)"><i class="fab fa-instagram" aria-hidden="true"></i></a></li>
                    <li><a href="https://www.facebook.com/tanitaangulo" target="_blank" rel="noopener noreferrer" data-i18n-aria-label="aria.facebookLabel" aria-label="Facebook (abre en ventana nueva)"><i class="fab fa-facebook-f" aria-hidden="true"></i></a></li>
                    <li><a href="https://wa.me/34620098860" target="_blank" rel="noopener noreferrer" data-i18n-aria-label="aria.whatsappLabel" aria-label="WhatsApp (abre en ventana nueva)"><i class="fab fa-whatsapp" aria-hidden="true"></i></a></li>
                  </ul>
                </nav>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>


  <script src="../components/footer.js"></script>

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- Scripts -->
  <script src="../assets/js/main.js" defer></script>
</body>
</html>
